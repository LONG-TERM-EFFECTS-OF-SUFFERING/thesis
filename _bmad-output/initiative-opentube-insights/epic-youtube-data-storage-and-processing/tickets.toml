# tickets.toml — epic-youtube-data-storage-and-processing
# Table order is the build order, taken from the v6 story numbering.
# Every `after` is empty: v6 declared no story prerequisites. Declare them with bmad-ticket.

[[entry]]
id = 1
type = "story"
title = "Store video metadata and raw video payload"
description = "As a researcher, I want video metadata and raw payloads stored so that collected video data can be analyzed and audited within the 30-day retention window. Videos are stored with key metadata, the raw YouTube payload and a fetch timestamp that starts the 30-day retention window."
