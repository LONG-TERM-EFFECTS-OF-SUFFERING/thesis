# tickets.toml — epic-traceable-youtube-collection
# Table order is the build order, taken from the v6 story numbering.
# Every `after` is empty: v6 declared no story prerequisites. Declare them with bmad-ticket.

[[entry]]
id = 1
type = "story"
title = "Create collection run model and status lifecycle"
description = "As a researcher, I want each collection attempt to have a recorded run status so that I can trace whether the dataset was collected successfully. A run stores project, query, status, started/finished timestamps and basic lifecycle states."
verify = "A run stores project, query, status, started/finished timestamps and basic lifecycle states."
covers = ["US-010"]
after = []
hitl = false
risk = "low"
estimate = 7
v6_key = "4-1-create-collection-run-model-and-status-lifecycle"

[[entry]]
id = 2
type = "story"
title = "Start a collection run from a saved query"
