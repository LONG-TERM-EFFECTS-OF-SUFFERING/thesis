[[entry]]
id = 2
type = "story"
title = "Validate generated YouTube API parameters"
description = """
Generated YouTube API parameters are validated before collection starts, so an invalid request is caught rather than spent against the quota.

One pure backend function validates a structured_query_params object and returns findings; it reports and never mutates. US-008 and US-009 call the same function, against edited values and at save time.

Checks: an allowlist of parameter names, so an edited set cannot smuggle in an unsupported parameter; part == "snippet"; type == "video"; non-empty q; maxResults an int in 0..50 and not a bool; order within the allowed enum; publishedAfter and publishedBefore RFC 3339 with an explicit offset; publishedAfter not later than publishedBefore; regionCode ISO 3166-1 alpha-2 shape; relevanceLanguage ISO 639-1 shape; the required keys part, type, q and maxResults present. Each finding carries a machine-readable parameter and code plus a human-readable message so US-008 can attach it to the right field.

The draft endpoint's response gains a validation array; a clean draft returns []. Findings are informational on a draft and never turn a successful translation into an error. The read-only draft panel shows them in its existing aria-live region.

What US-006 already does and this must not redo: order re-checked against the enum, max_videos_to_discover coerced, maxResults clamped to 50, and region_code / relevance_language dropped when longer than their SavedQuery columns. Those are length guards only; the US-006 review explicitly left format, RFC 3339 parsing and the date-range comparison here.

Stdlib only: re and datetime.fromisoformat. No new dependency.
"""
verify = "A valid parameter set returns no findings; one invalid example per rule returns its finding, and the draft endpoint's response carries the validation array."
covers = ["US-007"]
after = []
hitl = false
risk = "low"
estimate = 7
v6_key = "3-2-validate-generated-youtube-api-parameters"
folded_from = "archive-v6/3-2-validate-generated-youtube-api-parameters.md"

