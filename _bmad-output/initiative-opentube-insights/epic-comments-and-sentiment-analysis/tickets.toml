# tickets.toml — epic-comments-and-sentiment-analysis
# Table order is the build order, taken from the v6 story numbering.
# Every `after` is empty: v6 declared no story prerequisites. Declare them with bmad-ticket.

[[entry]]
id = 1
type = "story"
title = "Collect top-level comments for selected videos"
description = "As a researcher, I want to collect top-level comments for selected videos so that I can analyze audience reaction. The app collects top-level comments for selected videos and links comments to videos and collection runs and stores a fetch timestamp on each comment."
verify = "The app collects top-level comments for selected videos and links comments to videos and collection runs and stores a fetch timestamp on each comment."
covers = ["US-021"]
after = []
hitl = false
risk = "low"
estimate = 12
v6_key = "7-1-collect-top-level-comments-for-selected-videos"

[[entry]]
