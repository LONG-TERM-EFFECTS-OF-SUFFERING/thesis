id = 1
type = "story"
title = "Export videos, channels and logs as CSV"
description = "As a researcher, I want to export videos, channels and logs as CSV so that I can cite or continue analysis outside the app. The user can export videos, channels and request logs as CSV files; each export states the collection date and the date its data must be deleted."
